<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('karaman-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
          var resolved = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          var color = resolved === 'dark' ? '#161513' : '#f5f4f0'
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', color)
          var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          if (statusMeta) statusMeta.setAttribute('content', resolved === 'dark' ? 'black-translucent' : 'default')
        } catch (e) {}
      })()
    </script>
    <style>
      html { background: #f5f4f0; color-scheme: light dark; }
      html[data-theme="light"] { background: #f5f4f0; color-scheme: light; }
      html[data-theme="dark"] { background: #161513; color-scheme: dark; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #161513; }
      }
    </style>
    <meta name="description" content="The Karaman family calendar" />
    <meta name="application-name" content="Karaman" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Karaman" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Karaman Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
